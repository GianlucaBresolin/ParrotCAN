services:
  virtual-can-bus:
    build:
      context: ./virtual_can_bus
    pull_policy: build
    container_name: virtual-can-bus
    networks:
      - can-net

  victim-device:
    build:
      context: ./device
      args:
        MY_IDS: "0x101"
        INTERESTED_IDS: ""
        ROLE: "victim"
    container_name: victim-device
    depends_on:
      - virtual-can-bus
    networks:
      - can-net

  attacker-device:
    build:
      context: ./device
      args:
        MY_IDS: "0x101"
        INTERESTED_IDS: ""
        ROLE: "attacker"
    container_name: attacker-device
    depends_on:
      - virtual-can-bus
    networks:
      - can-net

  led-device:
    build:
      context: ./device
      args:
        MY_IDS: ""
        INTERESTED_IDS: "0x101"
        ROLE: "none"
    container_name: led-device
    depends_on:
      - virtual-can-bus
    networks:
      - can-net

networks:
  can-net:
    driver: bridge